name: Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - run: npm run all-tests
  windows-status:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: node node_modules/vite-plus/bin/vp test test/sdaStatus.test.ts test/sdaStatusWindows.test.ts test/sda.test.ts -t status
