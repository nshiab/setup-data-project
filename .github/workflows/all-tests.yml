name: Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run all-tests
  windows-status:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: node node_modules/vite-plus/bin/vp test test/sdaStatus.test.ts test/sdaStatusWindows.test.ts test/sda.test.ts -t status
  generated-tooling:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: node node_modules/vite-plus/bin/vp test test/sda.test.ts -t "standalone tooling"
  clean:
    name: Clean (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: node node_modules/vite-plus/bin/vp test test/clean.test.ts
