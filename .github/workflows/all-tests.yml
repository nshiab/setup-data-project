name: Tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - run: npm run all-tests
  clean:
    name: Clean (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: node node_modules/vite-plus/bin/vp test test/clean.test.ts
